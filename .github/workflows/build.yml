name: build
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  release:
    types:
    - created

env:
  IMAGE_OWNER: flukschander
  IMAGE_NAME: openfang

jobs:
  build:
    name: Build images
    strategy:
      fail-fast: false
      matrix:
        platform: [ { name: "linux/amd64", tag: "amd64", runner: "ubuntu-24.04" }, { name: "linux/arm64/v8", tag: "arm64v8", runner: "ubuntu-24.04-arm" } ]
    runs-on: ${{ matrix.platform.runner }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build Image
      run: |
        OPENFANG_VERSION=$(grep 'ARG OPENFANG_VERSION=' Dockerfile | cut -d'=' -f2)
        buildah bud --platform ${{ matrix.platform.name }} --build-arg OPENFANG_VERSION=$OPENFANG_VERSION -f ./Dockerfile -t ${{ env.IMAGE_NAME }}:${{ matrix.platform.tag }} .

    - name: Check images created
      run: buildah images | grep '${{ env.IMAGE_NAME }}'

    - name: Check image metadata
      run: buildah inspect ${{ env.IMAGE_NAME }}:${{ matrix.platform.tag }} | jq ".OCIv1.architecture"

    - name: Export image
      run: podman save -o /tmp/image.tar ${{ env.IMAGE_NAME }}:${{ matrix.platform.tag }}

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: image-${{ matrix.platform.tag }}
        path: /tmp/image.tar

  push:
    name: Publish images
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name == 'release'
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4

    - name: Import images
      run: |
        podman load -i ./image-amd64/image.tar
        podman load -i ./image-arm64v8/image.tar

    - name: Create multi-arch manifest
      run: |
        buildah manifest create ${{ env.IMAGE_NAME }}:latest
        buildah manifest add --arch amd64 ${{ env.IMAGE_NAME }}:latest ${{ env.IMAGE_NAME }}:amd64
        buildah manifest add --arch arm64 --variant v8 ${{ env.IMAGE_NAME }}:latest ${{ env.IMAGE_NAME }}:arm64v8

    - name: Push images
      run: |
        OPENFANG_VERSION=$(grep 'ARG OPENFANG_VERSION=' Dockerfile | cut -d'=' -f2)
        TAG_NAME=${{ github.event.release.tag_name }}
        # If the tag starts with 'v', keep it as is, otherwise we could append it. 
        # But we'll just use the release tag directly for consistency with your caddy-docker setup.
        
        buildah manifest push --all --format v2s2 --creds flukschander:${{ secrets.REGISTRY_PASSWORD }} ${{ env.IMAGE_NAME }}:latest docker://docker.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:latest
        buildah manifest push --all --format v2s2 --creds flukschander:${{ secrets.REGISTRY_PASSWORD }} ${{ env.IMAGE_NAME }}:latest docker://docker.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:$TAG_NAME
        
        buildah manifest push --all --creds ${{ secrets.QUAY_USERNAME }}:${{ secrets.QUAY_PASSWORD }} ${{ env.IMAGE_NAME }}:latest docker://quay.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:latest
        buildah manifest push --all --creds ${{ secrets.QUAY_USERNAME }}:${{ secrets.QUAY_PASSWORD }} ${{ env.IMAGE_NAME }}:latest docker://quay.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:$TAG_NAME
        
        buildah manifest push --all --creds flukschander:${{ secrets.GITHUB_TOKEN }} ${{ env.IMAGE_NAME }}:latest docker://ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:latest
        buildah manifest push --all --creds flukschander:${{ secrets.GITHUB_TOKEN }} ${{ env.IMAGE_NAME }}:latest docker://ghcr.io/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:$TAG_NAME
